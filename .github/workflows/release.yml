# Publica una version nueva de Aura cuando se sube una etiqueta vX.Y (scripts/release.ps1 -Push):
#   1. Compila el APK firmado (clave en los secretos del repositorio).
#   2. Crea la Release con Aura-X.Y.apk, Aura.apk (enlace fijo: releases/latest/download/Aura.apk)
#      y Aura-Instalador-Windows.zip.
#   Al terminar, pages.yml publica la landing con los datos de esta version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Comprobar la version
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con versionName=$name de version.properties"
            exit 1
          fi
          echo "VERSION=$name" >> "$GITHUB_ENV"

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto AURA_KEYSTORE_BASE64 (ver README, 'Publicar versiones')"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aura.keystore"
          echo "AURA_KEYSTORE=$RUNNER_TEMP/aura.keystore" >> "$GITHUB_ENV"

      - name: Compilar el APK firmado
        env:
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Preparar archivos y notas
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Aura-$VERSION.apk"
          cp "dist/Aura-$VERSION.apk" dist/Aura.apk
          repo="https://github.com/$GITHUB_REPOSITORY"
          python3 scripts/release_info.py --apk "dist/Aura-$VERSION.apk" \
            --file-url "$repo/releases/download/v$VERSION/Aura-$VERSION.apk" \
            --latest-url "$repo/releases/latest/download/Aura.apk" \
            --notes-out dist/notes.md --out dist/release.js
          cat dist/notes.md
          # Instalador para Windows (descarga ADB y Aura, instala y concede los permisos)
          (cd installer/windows && zip -q -r "$GITHUB_WORKSPACE/dist/Aura-Instalador-Windows.zip" .)

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aura ${{ env.VERSION }}
          body_path: dist/notes.md
          files: |
            dist/Aura-${{ env.VERSION }}.apk
            dist/Aura.apk
            dist/Aura-Instalador-Windows.zip
